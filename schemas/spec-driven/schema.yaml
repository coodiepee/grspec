name: spec-driven
version: 2
description: Default grspec workflow - proposal → specs ∥ design → ui → plan
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `grspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Domain Context**: Which bounded contexts does this change affect? Reference `grspec/domain-model.md`. Skip if no domain model exists.
      - **Risk Assessment**: Impact scope, regression risk, performance implications. REQUIRED — "no risk" is almost never true.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      ANTI-CHECK for Modified Capabilities: Can you point to a specific SHALL
      statement that changes? If not, use ADDED instead of MODIFIED.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and plan all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from grspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in grspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. ANTI-CHECK for Non-Goals: if a reader might expect this change to cover X and it doesn't, list X.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision. WARNING: "It seemed simpler" is not a rationale — cite concrete tradeoffs.
      - **Schema Changes**: (skip if no codegen) List schema files created/modified and estimated generated file count.
      - **Implementation Strategy**: (skip if < 3 components) Per-component table of strategy (codegen / TDD / AI+review / manual).
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation. WARNING: Every design has risks — an empty section means insufficient analysis.
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Use normative language (RFC 2119) for binding constraints:
      - SHALL / MUST for hard requirements the implementation must satisfy
      - SHOULD for strong recommendations that may be overridden with justification
      - MAY for optional approaches left to the implementor's discretion

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: ui
    generates: ui.md
    description: UI scope, status, and design decisions for the change
    template: ui.md
    instruction: |
      Create the ui artifact that records whether this change has a UI surface and how it relates to the project design foundation.

      Decision tree:
      1. Read proposal.md, design.md, and .grspec.yaml ui metadata
      2. Decide if the change has a UI surface (screens, components, layout, styling work):
         - No UI surface → write ui.md with Status: na, UI Scope, and Rationale; set ui.detected to false or remove the ui block in .grspec.yaml
      3. If UI surface exists:
         a. Check project foundation: `grspec ui status --json` or verify `grspec/ui/MASTER.md` exists
         b. If no project MASTER:
            - Write ui.md with Status: blocked, UI Scope, and Required before apply
            - Suggest `/grsx-ui-init` to create `grspec/ui/MASTER.md` (do NOT auto-run init)
            - MAY generate provisional change pages via `grspec-ui-design-system` with `provisional: true` frontmatter
         c. If project MASTER exists:
            - Write ui.md with Status: done, UI Scope, and Key Decisions
            - For new pages: `grspec ui design-system "<query>" --persist` output under change `ui/pages/`
            - Use `grspec-ui-reference` for token detail; use `grspec-ui-review` before apply
      4. NEVER create change-level MASTER.md — project MASTER lives only at `grspec/ui/MASTER.md`

      Sub-skills: `grspec-ui-init`, `grspec-ui-design-system`, `grspec-ui-reference`, `grspec-ui-review` (no hub skill).

      Status values (first line under ## Status): `na`, `blocked`, `done`. Missing or empty Status is invalid — fix before apply.
    requires:
      - design

  - id: plan
    generates: plan.md
    description: "Implementation plan with strategy-annotated tasks"
    template: plan.md
    instruction: |
      Create the implementation plan that breaks down the work with strategy annotations.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Place all UI implementation tasks under a `## UI` heading (required for v2 schema apply gates)
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Task descriptions SHOULD use imperative mood (e.g. "Create module X", not "Module X should be created")
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Annotate each task with exactly one strategy tag:
        - **[codegen]** — deterministic code generation (make gen, protoc, schema compilation)
        - **[TDD]** — test-driven development: write test first, then implement
        - **[AI+review]** — AI generates implementation, human or AI reviews
        - **[manual]** — requires manual human implementation

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure [AI+review]
      - [ ] 1.2 Add dependencies to package.json [manual]

      ## 2. Core Implementation

      - [ ] 2.1 Implement data model [TDD]
      - [ ] 2.2 Generate API handlers [codegen]
      ```

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design
      - ui

apply:
  requires: [plan]
  tracks: plan.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
